plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.winols.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.winols.app'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        debug { 
            applicationIdSuffix '.debug' 
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { 
        jvmTarget = '17' 
    }
    buildFeatures { 
        viewBinding true 
    }
    packaging { 
        resources { 
            excludes += ['/META-INF/{AL2.0,LGPL2.1}'] 
        } 
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // Opcjonalna lekka biblioteka do natywnego zapisu XLSX na Androidzie bez overheadu Apache POI
    // (w projekcie dostarczamy również wbudowany uniwersalny eksporter CSV z obsługą dialektów Excela)
    
    // Testy jednostkowe
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}